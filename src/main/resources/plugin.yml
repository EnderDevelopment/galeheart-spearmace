name: SpearMace
version: 1.0.0
main: com.enderdevelopment.plugin.Main
api-version: "1.21"
commands:
  spearmace:
    description: Gives you the blue Breeze Spear-Mace or launches it when held.
    usage: /spearmace [launch]
    permission: spearmace.use
permissions:
  spearmace.use:
    description: Allows the player to receive and use the Spear-Mace.
    default: op
